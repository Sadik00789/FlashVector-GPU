name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Standard GitHub runners have neither a CUDA toolkit nor a GPU. This switch
  # links a host-memory stand-in for the CUDA bridge (crates/engine/cpu_stub)
  # so Rust code is still type-checked, linted and unit-tested, which catches
  # FFI signature drift and logic regressions without GPU hardware.
  FLASHVECTOR_CPU_ONLY: "1"

jobs:
  rust:
    name: Rust (CPU-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The PyO3 extension is a cdylib that needs libpython to link a test
      # harness, so its unit tests are skipped here (it is still checked and
      # linted above). GPU integration tests are compiled out in CPU-only mode.
      - name: Unit tests
        run: cargo test --workspace --exclude gpu_vector_index

  cuda-compile:
    name: CUDA kernels compile (nvcc, no GPU)
    runs-on: ubuntu-latest
    # Advisory: validates the .cu sources build for every target architecture
    # without needing a GPU. Toolkit installation is occasionally flaky.
    continue-on-error: true
    env:
      FLASHVECTOR_CPU_ONLY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - name: Build kernel static library
        run: |
          cmake -S kernels -B kernels/build -DCMAKE_BUILD_TYPE=Release \
            -DCUDA_TOOLKIT_ROOT_DIR="$CUDA_PATH"
          cmake --build kernels/build -j

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy pytest numpy
      - name: Ruff lint
        run: ruff check python/flashvector_adapters python/tests_adapters python/gpu_vector_index python/tests/test_bindings.py
      - name: Ruff format
        run: ruff format --check python/flashvector_adapters python/tests_adapters python/gpu_vector_index python/tests/test_bindings.py
      - name: Mypy
        run: mypy python/flashvector_adapters
      - name: Pytest (adapters)
        run: python -m pytest python/tests_adapters -q

  web:
    name: Web (vitest, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Type-check and build
        run: pnpm build
