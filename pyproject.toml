[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "gpu_vector_index"
version = "1.0.0"
description = "Ultra-fast GPU vector search engine with CUDA sm_86 kernels, HNSW beam search, and IVF-PQ ADC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "FlashVector-GPU Developers", email = "dev@flashvector.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "gpu_vector_index.gpu_vector_index"
python-source = "python"
python-packages = ["flashvector_adapters"]
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests_adapters"]

[tool.ruff]
line-length = 100
target-version = "py39"
include = ["python/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "llama_index.*",
]
ignore_missing_imports = true