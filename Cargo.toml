[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/server",
    "crates/python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FlashVector-GPU Developers <dev@flashvector.ai>"]
license = "Apache-2.0"
repository = "https://github.com/flashvector/flashvector-gpu"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
overflow-checks = false

[profile.bench]
opt-level = 3
debug = true
lto = "thin"

[profile.dev]
opt-level = 1
debug = true
